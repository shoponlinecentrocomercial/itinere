<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#FFF8F0" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#14172A" media="(prefers-color-scheme: dark)">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' https://itinere.pro https://unpkg.com; script-src 'self' 'unsafe-inline' https://unpkg.com https://itinere.pro; style-src 'self' 'unsafe-inline' https://itinere.pro; img-src 'self' data: https:; connect-src 'self' https://itinere.pro;">

    <title data-i18n="meta.title.acceso">Acceder a Itinere</title>

    <link rel="icon" href="/img/logo.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/img/generated/apple-touch-icon.png">

    <link rel="stylesheet" href="https://itinere.pro/css/tokens.css">
    <link rel="stylesheet" href="https://itinere.pro/css/base.css">
    <link rel="stylesheet" href="https://itinere.pro/css/components.css">

    <script src="https://unpkg.com/@simplewebauthn/browser/dist/bundle/index.umd.min.js"></script>
    <script src="https://itinere.pro/js/i18n.js" defer></script>
    <script src="https://itinere.pro/js/components.js" defer></script>

    <style>
        .login-wrap {
            min-height: 100dvh;
            display: flex; flex-direction: column;
            padding: var(--sp-5);
            padding-top: calc(var(--safe-top) + var(--sp-6));
            padding-bottom: calc(var(--safe-bottom) + var(--sp-5));
        }
        .login-brand {
            text-align: center;
            margin-bottom: var(--sp-7);
        }
        .login-brand img { margin: 0 auto var(--sp-3); width: 80px; height: 80px; }
        .login-brand h1 { font-size: var(--fs-xl); margin: 0; }
        .login-brand p  { color: var(--c-ink-muted); margin: var(--sp-2) 0 0; }

        .login-form { display: flex; flex-direction: column; gap: var(--sp-3); flex: 1; }
        .login-divider {
            display: flex; align-items: center; gap: var(--sp-3);
            color: var(--c-ink-muted);
            font-size: var(--fs-sm);
            margin: var(--sp-5) 0;
        }
        .login-divider::before, .login-divider::after {
            content: ''; flex: 1; height: 1px; background: var(--c-border);
        }
        .login-footer {
            text-align: center;
            color: var(--c-ink-muted);
            font-size: var(--fs-xs);
            margin-top: var(--sp-6);
        }
        .login-footer a { color: var(--c-ink-soft); }

        .stage { display: none; }
        .stage.is-active { display: flex; flex-direction: column; gap: var(--sp-3); }

        .otp-help { text-align: center; color: var(--c-ink-soft); font-size: var(--fs-sm); }
    </style>
</head>
<body>

<div class="login-wrap">
    <div class="login-brand">
        <img src="/img/logo.svg" alt="" width="80" height="80">
        <h1 data-i18n="acceso.bienvenido">Bienvenido a Itinere</h1>
        <p data-i18n="acceso.subtitulo">Comparte tus rutas con quien quieras</p>
    </div>

    <form class="login-form" id="loginForm" onsubmit="return false;" novalidate>
        <!-- Etapa 1: email -->
        <div class="stage is-active" id="stage-email">
            <label for="email" class="visually-hidden">Email</label>
            <input id="email" type="email" autocomplete="email" inputmode="email" required
                   data-i18n-placeholder="acceso.email" placeholder="tu@email.com">
            <button class="btn btn--full" id="btn-email" type="submit">
                <span data-i18n="acceso.continuarEmail">Continuar con email</span>
            </button>

            <div class="login-divider" data-i18n="acceso.o">o continúa con</div>

            <button class="btn btn--accent btn--full" id="btn-bio" type="button" hidden>
                <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12C2 6.5 6.5 2 12 2a10 10 0 0 1 10 10"/><path d="M5 19.5C5.5 18 6 15 6 12c0-.7.12-1.37.34-2"/><path d="M17.29 21.02c-.81-1.46-1.29-3.21-1.29-5.02 0-2.21-1.79-4-4-4"/><path d="M7.49 21.02c.86-1.32 1.5-3.4 1.5-5.02 0-1.66 1.34-3 3-3"/><path d="M9.5 4.96a6 6 0 0 1 6.5 1.04"/></svg>
                <span data-i18n="acceso.biometrico">Huella / Face ID</span>
            </button>
        </div>

        <!-- Etapa 2: OTP -->
        <div class="stage" id="stage-otp">
            <p class="otp-help">
                <span data-i18n="acceso.codigoEnviado">Te hemos enviado un código a</span><br>
                <strong id="email-resumen"></strong>
            </p>
            <itinere-otp length="6" id="otp"></itinere-otp>
            <button class="btn btn--full" id="btn-otp" type="button" disabled>
                <span data-i18n="acceso.validar">Validar código</span>
            </button>
            <button class="btn btn--ghost btn--full" type="button" id="btn-back">
                <span data-i18n="acceso.atras">← Usar otro email</span>
            </button>
        </div>
    </form>

    <div class="login-footer">
        <a href="/terminos.html" data-i18n="acceso.terminos">Términos</a>
        ·
        <a href="/privacidad.html" data-i18n="acceso.privacidad">Privacidad</a>
    </div>
</div>

<script>
const { startAuthentication, startRegistration } = window.SimpleWebAuthnBrowser || {};

// Página de destino (la app llega aquí con ?pag=...)
const params = new URLSearchParams(window.location.search);
const pag = params.get('pag') || 'index';

// Detectar soporte WebAuthn — si no está, ocultamos el botón biométrico.
if (window.PublicKeyCredential) {
    document.getElementById('btn-bio').hidden = false;
}

const stageEmail = document.getElementById('stage-email');
const stageOtp   = document.getElementById('stage-otp');
const inputEmail = document.getElementById('email');
const btnEmail   = document.getElementById('btn-email');
const btnOtp     = document.getElementById('btn-otp');
const btnBack    = document.getElementById('btn-back');
const btnBio     = document.getElementById('btn-bio');
const otp        = document.getElementById('otp');
let emailActual  = '';

function mostrar(stage) {
    [stageEmail, stageOtp].forEach(s => s.classList.toggle('is-active', s === stage));
}

// --- Paso 1: pedir clave ---
btnEmail.addEventListener('click', async () => {
    const email = inputEmail.value.trim().toLowerCase();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        Toast.error(window.Itinere?.t('errores.emailInvalido') || 'Email inválido.');
        return;
    }
    btnEmail.disabled = true;
    try {
        const r = await fetch('https://itinere.pro/auth/email/request', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email }),
            credentials: 'include',
        });
        if (!r.ok) {
            const j = await r.json().catch(() => ({}));
            throw new Error(j.error || 'No se pudo enviar el código');
        }
        emailActual = email;
        document.getElementById('email-resumen').textContent = email;
        mostrar(stageOtp);
        setTimeout(() => otp.focus(), 50);
    } catch (e) {
        Toast.error(e.message);
    } finally {
        btnEmail.disabled = false;
    }
});

// --- Paso 2: OTP ---
otp.addEventListener('itinere:otp', () => { btnOtp.disabled = false; btnOtp.click(); });
btnOtp.addEventListener('click', async () => {
    const clave = otp.value;
    if (!/^\d{6}$/.test(clave)) return;
    btnOtp.disabled = true;
    try {
        const r = await fetch('https://itinere.pro/auth/email/verify', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: emailActual, clave, pag }),
            credentials: 'include',
        });
        const j = await r.json().catch(() => ({}));
        if (!r.ok || !j.ok) throw new Error(j.error || 'Código incorrecto');
        window.location.href = j.redirect;
    } catch (e) {
        Toast.error(e.message);
        btnOtp.disabled = false;
    }
});

btnBack.addEventListener('click', () => { mostrar(stageEmail); inputEmail.focus(); });

// --- WebAuthn ---
btnBio.addEventListener('click', async () => {
    if (!startAuthentication) return;
    try {
        const opts = await (await fetch('/generate-authentication-options', { credentials: 'include' })).json();
        const resp = await startAuthentication(opts);
        const r = await fetch('/verify-authentication?pag=' + encodeURIComponent(pag), {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify(resp),
        });
        const j = await r.json();
        if (j.verified) { window.location.href = j.redirect; return; }
        throw new Error('No verificado');
    } catch (e) {
        // No registrado: probamos a registrar
        try {
            const opts = await (await fetch('/generate-registration-options', { credentials: 'include' })).json();
            const resp = await startRegistration(opts);
            const r = await fetch('/verify-registration?pag=' + encodeURIComponent(pag), {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'include',
                body: JSON.stringify(resp),
            });
            const j = await r.json();
            if (j.verified) { window.location.href = j.redirect; return; }
        } catch (e2) {
            Toast.error('No se ha podido registrar el dispositivo.');
        }
    }
});
</script>
</body>
</html>
