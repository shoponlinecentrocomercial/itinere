<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <title>Itinere</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
    }
    .card {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 14px;
      padding: 20px;
      max-width: 420px;
      width: calc(100% - 24px);
      text-align: center;
      box-shadow: 0 12px 30px rgba(0,0,0,0.2);
    }
    #status {
      font-size: 14px;
      margin-top: 8px;
      opacity: 0.9;
    }
    button {
      background: #22c55e;
      color: #06270f;
      border: none;
      border-radius: 10px;
      padding: 12px 18px;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>Itinere</h2>
    <div id="status">Inicializando GPS…</div>
    <button id="trackBtn">Activar seguimiento</button>
  </div>

<script type="module">
<script type="module">
    import { Geolocation } from '@capacitor/geolocation';
    import { CapacitorHttp } from '@capacitor/core';
    import { registerPlugin } from '@capacitor/core';

    const BackgroundGeolocation = registerPlugin('BackgroundGeolocation');

    const statusEl = document.getElementById('status');
    const trackBtn = document.getElementById('trackBtn');
    let watcherId = null;

    // Función para enviar la ubicación (usando CapacitorHttp para evitar el bloqueo de 5 min)
    async function sendLocation(coords) {
        try {
            await CapacitorHttp.post({
                url: 'https://itinere.pro:8443/actualizar-ubicacion',
                headers: { 'Content-Type': 'application/json' },
                data: {
                    latitude: coords.latitude,
                    longitude: coords.longitude,
                    accuracy: coords.accuracy,
                    altitude: coords.altitude,
                    speed: coords.speed,
                    timestamp: Date.now()
                },
                // Importante para que las cookies de sesión viajen
                webFetchExtra: { credentials: 'include' } 
            });
            statusEl.textContent = `GPS OK: ${coords.latitude.toFixed(5)}, ${coords.longitude.toFixed(5)}`;
        } catch (err) {
            console.error('Error enviando ubicación:', err);
            statusEl.textContent = 'Error enviando ubicación';
        }
    }

    async function startTracking() {
        if (watcherId) {
            // Si ya está activo, lo paramos
            await BackgroundGeolocation.removeWatcher({ id: watcherId });
            watcherId = null;
            trackBtn.textContent = 'Activar seguimiento';
            statusEl.textContent = 'Seguimiento detenido';
            return;
        }

        statusEl.textContent = 'Solicitando permisos...';
        trackBtn.textContent = 'Detener seguimiento';

        try {
            watcherId = await BackgroundGeolocation.addWatcher(
                {
                    backgroundMessage: "Grabando ruta en segundo plano…",
                    backgroundTitle: "Itinere - Ruta activa",
                    requestPermissions: true,
                    stale: false,
                    distanceFilter: 5 // metros
                },
                (location, error) => {
                    if (error) {
                        if (error.code === "NOT_AUTHORIZED") {
                            statusEl.textContent = 'Permiso de ubicación denegado';
                            trackBtn.textContent = 'Activar seguimiento';
                            watcherId = null;
                        }
                        return;
                    }
                    // location contiene los datos
                    sendLocation(location);
                }
            );
            statusEl.textContent = 'GPS activo en segundo plano.';
        } catch (e) {
            statusEl.textContent = 'Error al iniciar: ' + e.message;
            trackBtn.textContent = 'Activar seguimiento';
        }
    }

    trackBtn.addEventListener('click', startTracking);
</script>
</body>
</html>
