<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <title>Itinere</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
    }
    .card {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 14px;
      padding: 20px;
      max-width: 420px;
      width: calc(100% - 24px);
      text-align: center;
      box-shadow: 0 12px 30px rgba(0,0,0,0.2);
    }
    #status {
      font-size: 14px;
      margin-top: 8px;
      opacity: 0.9;
    }
    button {
      background: #22c55e;
      color: #06270f;
      border: none;
      border-radius: 10px;
      padding: 12px 18px;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>Itinere</h2>
    <div id="status">Inicializando GPS…</div>
    <button id="trackBtn">Activar seguimiento</button>
  </div>

<script type="module">
    import { BackgroundLocation } from '@bglocation/capacitor';

    const statusEl = document.getElementById('status');
    const trackBtn = document.getElementById('trackBtn');
    let isTracking = false;

    async function startTracking() {
        if (isTracking) {
            await BackgroundLocation.stop();
            isTracking = false;
            trackBtn.textContent = 'Activar seguimiento';
            statusEl.textContent = 'Seguimiento detenido';
            return;
        }

        statusEl.textContent = 'Solicitando permisos...';
        trackBtn.textContent = 'Detener seguimiento';

        try {
            // 1. Verificar permisos antes de arrancar
const perms = await BackgroundLocation.checkPermissions();
statusEl.textContent = `Foreground: ${perms.location}, Background: ${perms.backgroundLocation}`;

if (perms.backgroundLocation !== 'granted') {
    statusEl.textContent = 'Falta permiso de ubicación en segundo plano. Ve a Ajustes > Apps > Itinere > Permisos > Ubicación > Permitir todo el tiempo.';
    // Intentar solicitarlo de nuevo (por si acaso)
    await BackgroundLocation.requestPermissions({ permissions: ['backgroundLocation'] });
}

// 2. Configurar y arrancar
try {
    await BackgroundLocation.configure({ /* tu config actual */ });
    
    // Escuchar el evento de HTTP para ver si el envío nativo funciona
    BackgroundLocation.addListener('onHttp', (event) => {
        statusEl.textContent = `HTTP: success=${event.success}, status=${event.statusCode}, buffered=${event.bufferedCount}`;
    });
    
    await BackgroundLocation.start();
    statusEl.textContent = 'Tracking iniciado. (Si no llegan datos, revisa el permiso de background)';
} catch (e) {
    statusEl.textContent = 'Error al iniciar: ' + e.message;
}
        } catch (e) {
            statusEl.textContent = 'Error al iniciar: ' + e.message;
            trackBtn.textContent = 'Activar seguimiento';
        }
    }

    trackBtn.addEventListener('click', startTracking);
</script>
</body>
</html>
