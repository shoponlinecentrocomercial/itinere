<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <title>Itinere</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
    }
    .card {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 14px;
      padding: 20px;
      max-width: 420px;
      width: calc(100% - 24px);
      text-align: center;
      box-shadow: 0 12px 30px rgba(0,0,0,0.2);
    }
    #status {
      font-size: 14px;
      margin-top: 8px;
      opacity: 0.9;
    }
    button {
      background: #22c55e;
      color: #06270f;
      border: none;
      border-radius: 10px;
      padding: 12px 18px;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>Itinere</h2>
    <div id="status">Inicializando GPS…</div>
    <button id="trackBtn">Activar seguimiento</button>
  </div>

<script type="module">
    import { BackgroundLocation } from '@bglocation/capacitor';

    const statusEl = document.getElementById('status');
    const trackBtn = document.getElementById('trackBtn');
    let isTracking = false;

    async function startTracking() {
        if (isTracking) {
            await BackgroundLocation.stop();
            isTracking = false;
            trackBtn.textContent = 'Activar seguimiento';
            statusEl.textContent = 'Seguimiento detenido';
            return;
        }

        statusEl.textContent = 'Solicitando permisos...';
        trackBtn.textContent = 'Detener seguimiento';

        try {
            // 1. Verificar permisos
            const perms = await BackgroundLocation.checkPermissions();
            
            if (perms.location !== 'granted') {
                await BackgroundLocation.requestPermissions({ permissions: ['location'] });
            }
            if (perms.backgroundLocation !== 'granted') {
                await BackgroundLocation.requestPermissions({ permissions: ['backgroundLocation'] });
            }

            // 2. Configurar el plugin (incluye el envío nativo a tu backend)
            await BackgroundLocation.configure({
                distanceFilter: 5,
                desiredAccuracy: 'high',
                heartbeatInterval: 15,
                http: {
                    url: 'https://itinere.pro:8443/actualizar-ubicacion',
                    headers: { 'Content-Type': 'application/json' },
                    buffer: { maxSize: 1000 }
                },
                notification: {
                    title: 'Itinere - Ruta activa',
                    text: 'Grabando ruta en segundo plano…'
                },
                debug: true
            });

            // 3. Escuchar eventos (solo para UI)
            BackgroundLocation.addListener('onLocation', (location) => {
                statusEl.textContent = `GPS OK: ${location.latitude.toFixed(5)}, ${location.longitude.toFixed(5)}`;
            });

            BackgroundLocation.addListener('onHttp', (event) => {
                if (event.success) {
                    console.log('POST nativo OK, status:', event.statusCode);
                } else {
                    console.warn('POST nativo falló, buffered:', event.bufferedCount);
                }
            });

            // 4. Arrancar
            await BackgroundLocation.start();
            isTracking = true;
            statusEl.textContent = 'GPS activo en segundo plano.';
        } catch (e) {
            statusEl.textContent = 'Error al iniciar: ' + e.message;
            trackBtn.textContent = 'Activar seguimiento';
        }
    }

    trackBtn.addEventListener('click', startTracking);
</script>
</body>
</html>
