<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <title>Itinere</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
    }
    .card {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 14px;
      padding: 20px;
      max-width: 420px;
      width: calc(100% - 24px);
      text-align: center;
      box-shadow: 0 12px 30px rgba(0,0,0,0.2);
    }
    #status {
      font-size: 14px;
      margin-top: 8px;
      opacity: 0.9;
    }
    button {
      background: #22c55e;
      color: #06270f;
      border: none;
      border-radius: 10px;
      padding: 12px 18px;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>Itinere</h2>
    <div id="status">Inicializando GPS…</div>
    <button id="trackBtn">Activar seguimiento</button>
  </div>
<script type="module">
  import { registerPlugin } from '@capacitor/core';
const BackgroundGps = registerPlugin('BackgroundGps');

// Prueba rápida
BackgroundGps.start({}).then(res => {
    console.log('Plugin nativo OK:', res);
    document.getElementById('status').textContent = 'Plugin nativo: ' + res.status;
});
    import { initializeApp } from 'firebase/app';
    import { getAuth, signInAnonymously } from 'firebase/auth';
    import { BackgroundGeolocationFirestore } from '@ajuarezso/capacitor-background-geolocation-firestore';

    // ⬇️ PEGA AQUÍ TU firebaseConfig DE LA CONSOLA DE FIREBASE
    const firebaseConfig = {
    apiKey: "AIzaSyDhM_0SU94n5gkCorzBVZaxjBfOKPiaLDQ",
    authDomain: "itinere-rutas.firebaseapp.com",
    projectId: "itinere-rutas",
    storageBucket: "itinere-rutas.firebasestorage.app",
    messagingSenderId: "820848723937",
    appId: "1:820848723937:web:508e75b8964ae6c4d874a0",
    measurementId: "G-L82LY1DLJ5"
  };


    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const statusEl = document.getElementById('status');
    const trackBtn = document.getElementById('trackBtn');
    let isTracking = false;
    let tokenRefreshInterval = null;

    async function startTracking() {
        if (isTracking) {
            // Parar
            await BackgroundGeolocationFirestore.clearFirestoreContext();
            await BackgroundGeolocationFirestore.stop();
            if (tokenRefreshInterval) clearInterval(tokenRefreshInterval);
            isTracking = false;
            trackBtn.textContent = 'Activar seguimiento';
            statusEl.textContent = 'Seguimiento detenido';
            return;
        }

        statusEl.textContent = 'Autenticando con Firebase...';
        trackBtn.textContent = 'Detener seguimiento';

        try {
            // 1. Autenticación anónima en Firebase
            const userCredential = await signInAnonymously(auth);
            const user = userCredential.user;
            const idToken = await user.getIdToken();

            // 2. Generar un ID de ruta único
            const rutaId = 'ruta_' + Date.now();

            // 3. Arrancar el watcher del GPS
            await BackgroundGeolocationFirestore.start({
                backgroundTitle: 'Itinere - Ruta activa',
                backgroundMessage: 'Grabando ruta en segundo plano…',
                distanceFilter: 5,
                requestPermissions: true,
            }, (location, error) => {
                if (location) {
                    statusEl.textContent = `GPS OK: ${location.latitude.toFixed(5)}`;
                }
            });

            // 4. Configurar la escritura nativa a Firestore
            await BackgroundGeolocationFirestore.setFirestoreContext({
                docPath: `rutas/${rutaId}`,
                locationField: 'puntos',
                projectId: firebaseConfig.projectId,
                idToken: idToken,
                writeThresholdMeters: 20, // Escribe cada 20m
            });

            // 5. Refrescar el token cada 50 minutos (expira a los 60)
            tokenRefreshInterval = setInterval(async () => {
                const newToken = await user.getIdToken(true);
                await BackgroundGeolocationFirestore.setFirestoreContext({
                    docPath: `rutas/${rutaId}`,
                    locationField: 'puntos',
                    projectId: firebaseConfig.projectId,
                    idToken: newToken,
                    writeThresholdMeters: 20,
                });
                console.log('Token de Firestore refrescado');
            }, 50 * 60 * 1000);

            isTracking = true;
            statusEl.textContent = `GPS activo. Ruta: ${rutaId}`;
            console.log('Ruta ID para el servidor:', rutaId);

        } catch (e) {
            statusEl.textContent = 'Error al iniciar: ' + e.message;
            trackBtn.textContent = 'Activar seguimiento';
        }
    }

    trackBtn.addEventListener('click', startTracking);
</script>
  
</body>
</html>
