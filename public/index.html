<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <title>Itinere</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
    }
    .card {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 14px;
      padding: 20px;
      max-width: 420px;
      width: calc(100% - 24px);
      text-align: center;
      box-shadow: 0 12px 30px rgba(0,0,0,0.2);
    }
    #status {
      font-size: 14px;
      margin-top: 8px;
      opacity: 0.9;
    }
    button {
      background: #22c55e;
      color: #06270f;
      border: none;
      border-radius: 10px;
      padding: 12px 18px;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>Itinere</h2>
    <div id="status">Inicializando GPS…</div>
    <button id="trackBtn">Activar seguimiento</button>
  </div>

<script type="module">
    import { BackgroundGeolocation } from '@capgo/background-geolocation';
    import { CapacitorHttp } from '@capacitor/core';

    const statusEl = document.getElementById('status');
    const trackBtn = document.getElementById('trackBtn');
    let isTracking = false;

    async function startTracking() {
        if (isTracking) {
            await BackgroundGeolocation.stop();
            isTracking = false;
            trackBtn.textContent = 'Activar seguimiento';
            statusEl.textContent = 'Seguimiento detenido';
            return;
        }

        statusEl.textContent = 'Solicitando permisos...';
        trackBtn.textContent = 'Detener seguimiento';

        try {
            await BackgroundGeolocation.start(
                {
                    backgroundMessage: "Grabando ruta en segundo plano…",
                    backgroundTitle: "Itinere - Ruta activa",
                    requestPermissions: true,
                    stale: false,
                    distanceFilter: 5,
                    // ⬇️ LA CLAVE: el envío lo hace el código nativo
                    url: 'https://itinere.pro:8443/actualizar-ubicacion',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                },
                (location, error) => {
                    // Este callback solo actualiza la UI cuando la app está despierta
                    if (error) {
                        if (error.code === "NOT_AUTHORIZED") {
                            statusEl.textContent = 'Permiso de ubicación denegado';
                            trackBtn.textContent = 'Activar seguimiento';
                            isTracking = false;
                        }
                        return;
                    }
                    if (location) {
                        statusEl.textContent = `GPS OK: ${location.latitude.toFixed(5)}, ${location.longitude.toFixed(5)}`;
                    }
                }
            );
            isTracking = true;
            statusEl.textContent = 'GPS activo en segundo plano.';
        } catch (e) {
            statusEl.textContent = 'Error al iniciar: ' + e.message;
            trackBtn.textContent = 'Activar seguimiento';
        }
    }

    trackBtn.addEventListener('click', startTracking);
</script>
</body>
</html>
