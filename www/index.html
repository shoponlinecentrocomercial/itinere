<!DOCTYPE html>
<html lang="es">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta name="theme-color" content="#FFF8F0" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#14172A" media="(prefers-color-scheme: dark)">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' https://itinere.pro https://itinere.pro:2083; connect-src 'self' https://itinere.pro https://itinere.pro:2083 wss://itinere.pro:2083; script-src 'self' 'unsafe-inline' https://itinere.pro https://unpkg.com https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://itinere.pro https://www.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https://itinere.pro; font-src 'self' data:; frame-src 'none'; object-src 'none';">

    <title data-i18n="meta.title.index">Itinere — comparte rutas fácil y divertido</title>
    <meta name="description" data-i18n="meta.descripcion.index" content="Itinere: graba, planifica y comparte rutas con quien quieras. Fácil de usar, divertido, en cualquier dispositivo.">

    <link rel="icon" href="/img/logo.svg" type="image/svg+xml">
    <link rel="icon" href="/genfavicon-32.png" sizes="32x32">
    <link rel="apple-touch-icon" href="/img/generated/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">

    <link rel="stylesheet" href="https://itinere.pro/css/tokens.css">
    <link rel="stylesheet" href="https://itinere.pro/css/base.css">
    <link rel="stylesheet" href="https://itinere.pro/css/components.css">

    <script src="https://itinere.pro/js/i18n.js" defer></script>
    <script src="https://itinere.pro/js/components.js" defer></script>
</head>
<body class="with-tabbar">

    <header class="appbar">
        <a href="/" class="appbar__logo" aria-label="Itinere">
            <img src="/img/logo.svg" width="32" height="32" alt="">
            <span>Itinere</span>
        </a>
        <span class="appbar__spacer"></span>
        <a href="/usuario.html" class="iconbtn" aria-label="Perfil" data-i18n-aria-label="nav.perfil">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </a>
    </header>

    <main class="container">
        <!-- Hero compacto -->
        <section class="mt-5 stack gap-3">
            <h1 data-i18n="home.hero.titulo">Descubre tu próxima ruta</h1>
            <p class="soft" data-i18n="home.hero.subtitulo">Graba, planifica y comparte. Sin complicaciones.</p>
        </section>

        <!-- Buscador -->
        <label class="search mt-4" aria-label="Buscar">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input id="q" type="search" data-i18n-placeholder="home.buscador" placeholder="Buscar rutas, lugares, autores…">
        </label>

        <!-- Chips de filtro -->
        <nav class="row-wrap gap-2 mt-4" aria-label="Filtros de actividad">
            <button class="chip is-active" data-filter="all"  data-i18n="filtros.todas">Todas</button>
            <button class="chip"           data-filter="near" data-i18n="filtros.cerca">Cerca</button>
            <button class="chip"           data-filter="walk" data-i18n="filtros.senderismo">Senderismo</button>
            <button class="chip"           data-filter="bike" data-i18n="filtros.bici">Bici</button>
            <button class="chip"           data-filter="car"  data-i18n="filtros.coche">Coche</button>
            <button class="chip"           data-filter="moto" data-i18n="filtros.moto">Moto</button>
        </nav>

        <!-- Resultados -->
        <div class="section-h">
            <h2 data-i18n="home.ultimas">Últimas rutas</h2>
        </div>

        <div id="resultados" class="grid-cards" aria-live="polite">
            <!-- Skeletons mientras carga -->
            <div class="card" aria-hidden="true">
                <div class="card__media skeleton"></div>
                <div class="card__body">
                    <div class="skeleton" style="height:18px;width:80%;margin-bottom:12px"></div>
                    <div class="skeleton" style="height:14px;width:60%"></div>
                </div>
            </div>
            <div class="card" aria-hidden="true">
                <div class="card__media skeleton"></div>
                <div class="card__body">
                    <div class="skeleton" style="height:18px;width:80%;margin-bottom:12px"></div>
                    <div class="skeleton" style="height:14px;width:60%"></div>
                </div>
            </div>
        </div>
    </main>

    <itinere-tabbar active="home"></itinere-tabbar>

    <!-- Sheet flotante al pulsar el "+" del tab bar -->
    <div class="sheet-backdrop" id="backdrop"></div>
    <aside class="sheet" id="sheet-nueva" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
        <div class="sheet__handle" aria-hidden="true"></div>
        <header class="sheet__header">
            <h2 id="sheet-title" class="text-lg" data-i18n="home.nueva.titulo">¿Qué quieres hacer?</h2>
            <button class="iconbtn" id="sheet-close" aria-label="Cerrar">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
        </header>
        <div class="sheet__body stack gap-3">
            <a href="/grabar-ruta.html" class="btn btn--full">
                <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="6" fill="currentColor"/></svg>
                <span data-i18n="nav.grabar">Grabar ruta</span>
            </a>
            <a href="/planificar-ruta.html" class="btn btn--accent btn--full">
                <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="3,6 9,3 15,6 21,3 21,18 15,21 9,18 3,21"/><line x1="9" y1="3" x2="9" y2="18"/><line x1="15" y1="6" x2="15" y2="21"/></svg>
                <span data-i18n="nav.planificar">Planificar ruta</span>
            </a>
        </div>
    </aside>

<script>
// --- Cookie / sesión ---
let userId = 0;
fetch('/read-cookie', { credentials: 'include' })
    .then(r => r.json())
    .then(d => { if (d.logueado) userId = d.id; })
    .catch(() => {});

// --- Cargar rutas desde index.php ---
async function cargarRutas(filtro = 'all') {
    try {
        const r = await fetch('https://itinere.pro/index.php', { credentials: 'include' });
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const html = await r.text();
        // index.php devuelve los datos como HTML legacy. Hasta que migremos
        // ese endpoint a JSON, hacemos un parse mínimo para sacar las rutas.
        renderLegacy(html);
    } catch (e) {
        Toast.error('No se pueden cargar las rutas ahora mismo.');
        document.getElementById('resultados').innerHTML = '';
    }
}

function renderLegacy(html) {
    // Por compatibilidad inyectamos el HTML legacy. El próximo paso es
    // que `index.php` devuelva JSON con campos y nosotros pintemos
    // <itinere-card> aquí.
    const target = document.getElementById('resultados');
    target.innerHTML = '';
    const tmp = document.createElement('div');
    tmp.innerHTML = html;
    // Las "tarjetas" antiguas eran divs con borde naranja; envolvemos
    // cada una en una col del grid para que se vea uniforme.
    tmp.querySelectorAll(':scope > div').forEach(div => {
        const wrap = document.createElement('div');
        wrap.className = 'card';
        const body = document.createElement('div');
        body.className = 'card__body';
        body.appendChild(div);
        wrap.appendChild(body);
        target.appendChild(wrap);
    });
    if (!target.children.length) {
        target.innerHTML = `<p class="muted" data-i18n="home.vacio">No hay rutas todavía.</p>`;
    }
}

// --- Chips ---
document.querySelectorAll('[data-filter]').forEach(chip => {
    chip.addEventListener('click', () => {
        document.querySelectorAll('[data-filter]').forEach(c => c.classList.remove('is-active'));
        chip.classList.add('is-active');
        cargarRutas(chip.dataset.filter);
    });
});

// --- Sheet "nueva ruta" ---
const sheet    = document.getElementById('sheet-nueva');
const backdrop = document.getElementById('backdrop');
document.addEventListener('itinere:cta', () => {
    sheet.classList.add('is-open');
    backdrop.classList.add('is-open');
});
document.getElementById('sheet-close').addEventListener('click', cerrarSheet);
backdrop.addEventListener('click', cerrarSheet);
function cerrarSheet() {
    sheet.classList.remove('is-open');
    backdrop.classList.remove('is-open');
}

// Carga inicial
cargarRutas();
</script>
</body>
</html>
