<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Itinere">
  <title>Itinere</title>
  <!-- Camino serpenteante: origen (turquesa) → destino (carmín). -->
  <path d="M16 50 C 16 36, 48 38, 48 22"
        fill="none"
        stroke="#2EC4B6"
        stroke-width="6"
        stroke-linecap="round"
        stroke-dasharray="0 0"/>
  <!-- Punto origen -->
  <circle cx="16" cy="50" r="6" fill="#2EC4B6"/>
  <circle cx="16" cy="50" r="2.5" fill="#FFF8F0"/>
  <!-- Pin destino -->
  <circle cx="48" cy="22" r="10" fill="#E63946"/>
  <circle cx="48" cy="22" r="4" fill="#FFF8F0"/>
</svg>
