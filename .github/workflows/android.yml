name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install NPM dependencies
        run: |
          npm ci
          npm install @capacitor/cli @capacitor/core @capacitor/android @capacitor/geolocation @capacitor-community/admob @capacitor/assets

      - name: Verify public folder
        run: |
          if [ ! -d "public" ]; then
            echo "ERROR: public folder not found"
            exit 1
          fi
          if [ ! -f "public/index.html" ]; then
            echo "ERROR: public/index.html not found"
            exit 1
          fi
          echo "✅ public folder verified"

      - name: Initialize Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Generate App Icons (optional)
        run: npx capacitor-assets generate --android 2>/dev/null || echo "Assets generation skipped"

      - name: Add Android permissions for GPS / background execution
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ ! -f "$MANIFEST" ]; then
            echo "ERROR: AndroidManifest.xml not found at $MANIFEST"
            exit 1
          fi

          if ! grep -q "ACCESS_FINE_LOCATION" "$MANIFEST"; then
            sed -i '/<manifest/a \    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />' "$MANIFEST"
            sed -i '/<manifest/a \    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />' "$MANIFEST"
            sed -i '/<manifest/a \    <uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION" />' "$MANIFEST"
            sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET" />' "$MANIFEST"
            sed -i '/<manifest/a \    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />' "$MANIFEST"
          fi

          echo "✅ permisos Android añadidos"

      - name: Install Android SDK command-line tools and platform (sdkmanager)
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y unzip wget
          # Usar el directorio temporal del runner para evitar permisos y persistencia innecesaria
          ANDROID_SDK_ROOT="$RUNNER_TEMP/android-sdk"
          mkdir -p "${ANDROID_SDK_ROOT}/cmdline-tools"
          cd "${ANDROID_SDK_ROOT}"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline.zip
          unzip -q cmdline.zip -d "${ANDROID_SDK_ROOT}/cmdline-tools"
          mv "${ANDROID_SDK_ROOT}/cmdline-tools/cmdline-tools" "${ANDROID_SDK_ROOT}/cmdline-tools/latest" || true
          rm cmdline.zip
          export PATH="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin:${PATH}"
          yes | sdkmanager --sdk_root="${ANDROID_SDK_ROOT}" --licenses || true
          sdkmanager --sdk_root="${ANDROID_SDK_ROOT}" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}" >> $GITHUB_ENV
          echo "${ANDROID_SDK_ROOT}/platform-tools:${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin:${PATH}" >> $GITHUB_PATH

      - name: Set up Gradle (runner-provided)
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: '8.1.1'

      - name: Build APK Release
        run: |
          cd android
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew || true
          fi
          # preferir el wrapper si existe, si no usar gradle del runner
          if [ -f "./gradlew" ]; then
            ./gradlew assembleRelease --no-daemon
          else
            gradle assembleRelease --no-daemon
          fi

      - name: Find release APK
        id: find_apk
        run: |
          set -e
          APK_FILE=$(find android/app/build/outputs/apk -type f -name "*release*.apk" | head -n 1 || true)
          if [ -z "$APK_FILE" ]; then
            echo "No APK found at expected location"
            exit 1
          fi
          echo "apk_file=$APK_FILE" >> $GITHUB_OUTPUT
          echo "apk_dir=$(dirname "$APK_FILE")" >> $GITHUB_OUTPUT

      - name: Sign APK
        id: sign_app
        uses: r0adkll/sign-android-release@v1
        with:
          # sign-android-release expects the releaseDirectory (folder) where unsigned apks are located
          releaseDirectory: ${{ steps.find_apk.outputs.apk_dir }}
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEYSTORE_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: itinere-apk
          path: ${{ steps.sign_app.outputs.signedReleaseFile }}
