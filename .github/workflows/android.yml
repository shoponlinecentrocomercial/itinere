name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'  # ⬅️ CAMBIADO a 21

      - name: Install dependencies
        run: npm install

      - name: Verify plugin is installed
        run: |
          echo "=== Buscando capacitor-passkey en node_modules ==="
          ls -la node_modules/@capgo/ 2>/dev/null || echo "NO HAY CARPETA @capgo"
          echo "=== Buscando en package.json ==="
          grep -i "passkey" package.json || echo "NO ESTÁ EN PACKAGE.JSON"

      - name: Remove existing Android platform
        run: rm -rf android

      - name: Add Android platform
        run: npx cap add android

      # ⬇️ COPIAR EL PLUGIN NATIVO AL PROYECTO ANDROID
      - name: Copy native plugin
        run: |
          mkdir -p android/app/src/main/java/symphoniertech/itinere
          cp native-plugin/symphoniertech/itinere/BackgroundGpsPlugin.java android/app/src/main/java/symphoniertech/itinere/
          echo "=== Plugin copiado ==="
          ls -la android/app/src/main/java/symphoniertech/itinere/

      # ⬇️ PARCHEAR MainActivity PARA REGISTRAR EL PLUGIN
      - name: Patch MainActivity to register plugin
        run: |
          MAIN_ACTIVITY=$(find android/app/src/main/java -name "MainActivity.java")
          echo "Parcheando: $MAIN_ACTIVITY"
    
          # Añadir import
          sed -i 's|import com.getcapacitor.BridgeActivity;|import com.getcapacitor.BridgeActivity;\nimport symphoniertech.itinere.BackgroundGpsPlugin;|' "$MAIN_ACTIVITY"
    
          # Añadir registerPlugin dentro de onCreate
          # Primero nos aseguramos de que existe onCreate
          sed -i 's|public class MainActivity extends BridgeActivity {}|public class MainActivity extends BridgeActivity {\n    @Override\n    public void onCreate(android.os.Bundle savedInstanceState) {\n        registerPlugin(BackgroundGpsPlugin.class);\n        super.onCreate(savedInstanceState);\n    }\n}|' "$MAIN_ACTIVITY"
    
          echo "=== MainActivity.java después del parcheo ==="
          cat "$MAIN_ACTIVITY"

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Add Background Geolocation Permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          # Insertar permisos antes de <application>
          sed -i 's|<application|<uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n\n    <application|' "$MANIFEST"
          echo "=== Manifest después del parcheo ==="
          grep -A2 -B2 "uses-permission" "$MANIFEST" | head -30

      - name: Inspect generated build.gradle
        run: |
          echo "=== Contenido de android/build.gradle ==="
          cat android/build.gradle
          echo "=== Buscando versión de AGP ==="
          grep "com.android.tools.build:gradle" android/build.gradle || echo "NO ENCONTRADO"

      - name: Force AGP 8.9.1
        run: |
          cd android
          sed -i "s|com.android.tools.build:gradle:[0-9.]*|com.android.tools.build:gradle:8.9.1|" build.gradle
          echo "=== Después de modificar: ==="
          grep "com.android.tools.build:gradle" build.gradle

      - name: Enable WebView debugging
        run: |
          # Busca el MainActivity.java generado por Capacitor
          MAIN_ACTIVITY=$(find android/app/src/main/java -name "MainActivity.java")
          echo "Parcheando: $MAIN_ACTIVITY"
    
          # Inserta la llamada de depuración justo después de super.onCreate()
          sed -i 's|super.onCreate(savedInstanceState);|super.onCreate(savedInstanceState);\n        if (BuildConfig.DEBUG) { WebView.setWebContentsDebuggingEnabled(true); }|' "$MAIN_ACTIVITY"
    
          # Añade los imports necesarios si no están
          sed -i 's|^import com.getcapacitor.BridgeActivity;|import com.getcapacitor.BridgeActivity;\nimport android.webkit.WebView;|' "$MAIN_ACTIVITY"
    
          echo "=== MainActivity.java modificado ==="
          cat "$MAIN_ACTIVITY"

# ⬇️ Decodificar el keystore DENTRO del proyecto Android
      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/itinere-release.jks
          ls -la android/app/itinere-release.jks

      - name: Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease \
            -PRELEASE_STORE_PASSWORD="${{ secrets.KEYSTORE_PASSWORD }}" \
            -PRELEASE_KEY_ALIAS="${{ secrets.KEY_ALIAS }}" \
            -PRELEASE_KEY_PASSWORD="${{ secrets.KEY_PASSWORD }}"

      - name: Create signing config file
        run: |
          cd android
          cat > signing.gradle << 'EOF'
          android {
              signingConfigs {
                  release {
                      storeFile file("itinere-release.jks")
                      storePassword project.findProperty('RELEASE_STORE_PASSWORD') ?: ''
                      keyAlias project.findProperty('RELEASE_KEY_ALIAS') ?: ''
                      keyPassword project.findProperty('RELEASE_KEY_PASSWORD') ?: ''
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF
          cat signing.gradle

      - name: Apply signing config to app/build.gradle
        run: |
          cd android/app
          echo "" >> build.gradle
          echo "apply from: '../signing.gradle'" >> build.gradle
          echo "=== app/build.gradle final ==="
          cat build.gradle
      
      - name: Install assets
        run: npm install @capacitor/assets --save-dev

      - name: Generate Android assets
        run: npx capacitor-assets generate --android

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.11.1

      - name: Generate Gradle Wrapper
        run: |
          cd android
          gradle wrapper --gradle-version 8.11.1

      - name: Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease \
            -PRELEASE_STORE_PASSWORD="${{ secrets.KEYSTORE_PASSWORD }}" \
            -PRELEASE_KEY_ALIAS="${{ secrets.KEY_ALIAS }}" \
            -PRELEASE_KEY_PASSWORD="${{ secrets.KEY_PASSWORD }}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
