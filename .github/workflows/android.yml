name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Remove existing Android platform
        run: rm -rf android

      - name: Add Android platform
        run: npx cap add android

      # ⬇️ ESTE PASO ES CRÍTICO: actualizar AGP a 8.3.0
      - name: Update AGP to 8.3.0
        run: |
          cd android
          sed -i "s/com.android.tools.build:gradle:8.1.1/com.android.tools.build:gradle:8.3.0/" build.gradle
          echo "=== build.gradle DESPUÉS del cambio ==="
          grep "com.android.tools.build:gradle" build.gradle

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.4

      - name: Generate Gradle Wrapper
        run: |
          cd android
          gradle wrapper --gradle-version 8.4

      - name: Build APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
