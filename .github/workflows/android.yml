name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'  # ⬅️ CAMBIADO a 21

      - name: Install dependencies
        run: npm install

      - name: Remove existing Android platform
        run: rm -rf android

      - name: Add Android platform
        run: npx cap add android

      - name: Inspect generated build.gradle
        run: |
          echo "=== Contenido de android/build.gradle ==="
          cat android/build.gradle
          echo "=== Buscando versión de AGP ==="
          grep "com.android.tools.build:gradle" android/build.gradle || echo "NO ENCONTRADO"

      - name: Force AGP 8.9.1
        run: |
          cd android
          sed -i "s|com.android.tools.build:gradle:[0-9.]*|com.android.tools.build:gradle:8.9.1|" build.gradle
          echo "=== Después de modificar: ==="
          grep "com.android.tools.build:gradle" build.gradle

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Generate Android assets
        run: npx capacitor-assets generate --android

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.11.1

      - name: Generate Gradle Wrapper
        run: |
          cd android
          gradle wrapper --gradle-version 8.11.1

      - name: Build APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
