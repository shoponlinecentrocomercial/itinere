name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'  # ⬅️ CAMBIADO a 21

      - name: Install dependencies
        run: npm install

      - name: Remove existing Android platform
        run: rm -rf android

      - name: Add Android platform
        run: npx cap add android

      - name: Inspect generated build.gradle
        run: |
          echo "=== Contenido de android/build.gradle ==="
          cat android/build.gradle
          echo "=== Buscando versión de AGP ==="
          grep "com.android.tools.build:gradle" android/build.gradle || echo "NO ENCONTRADO"

      - name: Force AGP 8.9.1
        run: |
          cd android
          sed -i "s|com.android.tools.build:gradle:[0-9.]*|com.android.tools.build:gradle:8.9.1|" build.gradle
          echo "=== Después de modificar: ==="
          grep "com.android.tools.build:gradle" build.gradle

      - name: Enable WebView debugging
        run: |
          # Busca el MainActivity.java generado por Capacitor
          MAIN_ACTIVITY=$(find android/app/src/main/java -name "MainActivity.java")
          echo "Parcheando: $MAIN_ACTIVITY"
    
          # Inserta la llamada de depuración justo después de super.onCreate()
          sed -i 's|super.onCreate(savedInstanceState);|super.onCreate(savedInstanceState);\n        if (BuildConfig.DEBUG) { WebView.setWebContentsDebuggingEnabled(true); }|' "$MAIN_ACTIVITY"
    
          # Añade los imports necesarios si no están
          sed -i 's|^import com.getcapacitor.BridgeActivity;|import com.getcapacitor.BridgeActivity;\nimport android.webkit.WebView;|' "$MAIN_ACTIVITY"
    
          echo "=== MainActivity.java modificado ==="
          cat "$MAIN_ACTIVITY"

      - name: Sync Capacitor
        run: npx cap sync android

# ⬇️ Decodificar el keystore DENTRO del proyecto Android
      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/itinere-release.jks
          ls -la android/app/itinere-release.jks

# ⬇️ Escribir credenciales en gradle.properties (forma que Gradle respeta)
      - name: Write signing properties
        run: |
          cd android
          echo "RELEASE_STORE_FILE=itinere-release.jks" >> gradle.properties
          echo "RELEASE_STORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> gradle.properties
          echo "RELEASE_KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> gradle.properties
          echo "RELEASE_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> gradle.properties

# ⬇️ Parchear build.gradle de app/ insertando la firma en el bloque android{} existente
      - name: Configure Release Signing
        run: |
          cd android/app

          cat > /tmp/patch_gradle.py << 'PYEOF'
          import re
    
          with open('build.gradle', 'r') as f:
          content = f.read()
    
          # Bloque de signingConfigs a insertar
          signing_block = '''
          signingConfigs {
            release {
                storeFile file(RELEASE_STORE_FILE)
                storePassword RELEASE_STORE_PASSWORD
                keyAlias RELEASE_KEY_ALIAS
                keyPassword RELEASE_KEY_PASSWORD
            }
          }
          '''
    
          # Insertar después de la primera apertura "android {"
          content = content.replace('android {', 'android {' + signing_block, 1)
    
          # Añadir signingConfig al buildType release si no está
          content = re.sub(
            r'(release\s*\{)',
            r'\1\n            signingConfig signingConfigs.release',
            content,
            count=1
          )
    
          with open('build.gradle', 'w') as f:
          f.write(content)
          PYEOF

          python3 /tmp/patch_gradle.py

          echo "=== build.gradle después del parcheo ==="
          cat build.gradle

      - name: Install assets
        run: npm install @capacitor/assets --save-dev

      - name: Generate Android assets
        run: npx capacitor-assets generate --android

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.11.1

      - name: Generate Gradle Wrapper
        run: |
          cd android
          gradle wrapper --gradle-version 8.11.1

      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
