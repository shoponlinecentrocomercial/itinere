pluginManagement {
    repositories {
        gradlePluginPortal()
        google()
        mavenCentral()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "Itinere"
include ':app'

/*
 Reference the Capacitor Android module inside node_modules.
 This is the standard layout generated by `npx cap add android`.
*/
include ':capacitor-android'
project(':capacitor-android').projectDir = file('../node_modules/@capacitor/android')

include ':capacitor-cordova-android-plugins'
project(':capacitor-cordova-android-plugins').projectDir = file('../node_modules/@capacitor/cordova-android-plugins')
