plugins {
    id 'com.android.application'
}

android {
    namespace 'com.symphoniertech.itinere'
    compileSdk 34

    defaultConfig {
        applicationId "com.symphoniertech.itinere"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            // Ajusta minify/ProGuard según tus necesidades
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Si usas Kotlin, configura kotlinOptions aquí
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    // Dependencia al módulo Capacitor que vive en node_modules
    implementation project(':capacitor-android')
    implementation project(':capacitor-cordova-android-plugins')

    // dependencias Android habituales
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
}
